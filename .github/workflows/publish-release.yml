name: Publish TrollStore IPA to Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifact from build run
        uses: actions/download-artifact@v4
        with:
          name: nanoMuse-trollstore-release-ipa
          run-id: 38753511885
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ./ipa_out

      - name: Verify IPA
        run: |
          ls -lh ./ipa_out

      - name: Upload to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v0.1.0-custom ./ipa_out/nanoMuse-trollstore-release.ipa --clobber
