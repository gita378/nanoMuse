name: Publish TrollStore IPA to Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifact from build run
        uses: actions/download-artifact@v4
        with:
          name: nanoMuse-trollstore-release-ipa
          run-id: 38753511885
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ./ipa_out

      - name: Upload via curl to Release
        run: |
          FILE="./ipa_out/nanoMuse-trollstore-release.ipa"
          ls -lh "$FILE"
          
          # Delete existing asset if any
          ASSET_ID=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/gita378/nanoMuse/releases/413830470/assets" | \
            jq -r '.[] | select(.name=="nanoMuse-trollstore-release.ipa") | .id')
          if [ -n "$ASSET_ID" ] && [ "$ASSET_ID" != "null" ]; then
            echo "Deleting old asset: $ASSET_ID"
            curl -s -X DELETE -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/gita378/nanoMuse/releases/assets/$ASSET_ID"
          fi

          echo "Uploading asset..."
          curl -s -f -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @"$FILE" \
            "https://uploads.github.com/repos/gita378/nanoMuse/releases/413830470/assets?name=nanoMuse-trollstore-release.ipa"
